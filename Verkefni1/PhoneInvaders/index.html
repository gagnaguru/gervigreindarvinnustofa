<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Invaders</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: #000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            border: 2px solid #333;
        }
        #ui {
            display: flex;
            justify-content: space-between;
            width: 800px;
            margin-bottom: 10px;
            font-size: 24px;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border: 2px solid white;
            border-radius: 10px;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Level: <span id="level">1</span></div>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="game-over">
        <h1 id="game-over-title">GAME OVER</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <button onclick="resetGame()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const gameOverScreen = document.getElementById('game-over');
        const gameOverTitle = document.getElementById('game-over-title');
        const finalScoreElement = document.getElementById('final-score');

        // Game state
        let score = 0;
        let level = 1;
        let isGameOver = false;
        let animationId;

        // Input handling
        const keys = {
            ArrowLeft: false,
            ArrowRight: false,
            Space: false
        };

        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft') keys.ArrowLeft = true;
            if (e.code === 'ArrowRight') keys.ArrowRight = true;
            if (e.code === 'Space') {
                keys.Space = true;
                e.preventDefault(); // Prevent scrolling
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft') keys.ArrowLeft = false;
            if (e.code === 'ArrowRight') keys.ArrowRight = false;
            if (e.code === 'Space') keys.Space = false;
        });

        // Player
        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 60,
            width: 50,
            height: 50,
            speed: 5,
            cooldown: 0,
            draw() {
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🪩', this.x + this.width / 2, this.y + this.height / 2);
            },
            update() {
                if (keys.ArrowLeft && this.x > 0) {
                    this.x -= this.speed;
                }
                if (keys.ArrowRight && this.x < canvas.width - this.width) {
                    this.x += this.speed;
                }
                
                if (this.cooldown > 0) {
                    this.cooldown--;
                }

                if (keys.Space && this.cooldown === 0) {
                    projectiles.push({
                        x: this.x + this.width / 2,
                        y: this.y,
                        radius: 15,
                        speed: 7
                    });
                    this.cooldown = 20; // Frames between shots
                }
            }
        };

        // Projectiles (Disco Balls)
        let projectiles = [];

        function drawProjectiles() {
            projectiles.forEach(p => {
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🍌', p.x, p.y);
            });
        }

        function updateProjectiles() {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                projectiles[i].y -= projectiles[i].speed;
                
                // Remove if off screen
                if (projectiles[i].y < -20) {
                    projectiles.splice(i, 1);
                }
            }
        }

        // Aliens (Mobile Phones)
        let aliens = [];
        const alienRows = 4;
        const alienCols = 10;
        const alienWidth = 40;
        const alienHeight = 40;
        const alienPadding = 20;
        const alienOffsetTop = 50;
        const alienOffsetLeft = 80;
        
        let alienDirection = 1;
        let alienSpeed = 1;
        let alienMoveDown = false;

        function initAliens() {
            aliens = [];
            for (let r = 0; r < alienRows; r++) {
                for (let c = 0; c < alienCols; c++) {
                    aliens.push({
                        x: c * (alienWidth + alienPadding) + alienOffsetLeft,
                        y: r * (alienHeight + alienPadding) + alienOffsetTop,
                        width: alienWidth,
                        height: alienHeight,
                        active: true
                    });
                }
            }
        }

        function drawAliens() {
            aliens.forEach(alien => {
                if (alien.active) {
                    ctx.font = '30px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('📱', alien.x + alien.width / 2, alien.y + alien.height / 2);
                }
            });
        }

        function updateAliens() {
            let hitEdge = false;
            
            // Check edges
            aliens.forEach(alien => {
                if (alien.active) {
                    if (alien.x + alien.width > canvas.width - 10 || alien.x < 10) {
                        hitEdge = true;
                    }
                }
            });

            if (hitEdge) {
                alienDirection *= -1;
                alienMoveDown = true;
                alienSpeed += 0.2; // Increase speed slightly when hitting edge
            }

            aliens.forEach(alien => {
                if (alien.active) {
                    alien.x += alienSpeed * alienDirection;
                    if (alienMoveDown) {
                        alien.y += 20;
                    }
                    
                    // Game over if aliens reach player
                    if (alien.y + alien.height >= player.y) {
                        endGame(false);
                    }
                }
            });
            
            alienMoveDown = false;
        }

        // Collision detection
        function checkCollisions() {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                let hit = false;
                
                for (let j = 0; j < aliens.length; j++) {
                    let a = aliens[j];
                    
                    if (a.active) {
                        // Simple bounding box collision
                        // The projectile is centered at p.x, p.y with font size 24
                        // The alien is at a.x, a.y with width 40, height 40
                        if (p.x > a.x && p.x < a.x + a.width &&
                            p.y > a.y && p.y < a.y + a.height) {
                            
                            a.active = false;
                            hit = true;
                            score += 10;
                            scoreElement.textContent = score;
                            break;
                        }
                    }
                }
                
                if (hit) {
                    projectiles.splice(i, 1);
                }
            }
        }

        // Check level completion
        function checkLevel() {
            const activeAliens = aliens.filter(a => a.active);
            if (activeAliens.length === 0) {
                level++;
                levelElement.textContent = level;
                alienSpeed = 1 + (level * 0.5); // Increase base speed per level
                alienDirection = 1;
                projectiles = [];
                initAliens();
            }
        }

        function endGame(win) {
            isGameOver = true;
            cancelAnimationFrame(animationId);
            gameOverScreen.style.display = 'block';
            gameOverTitle.textContent = win ? 'YOU WIN!' : 'GAME OVER';
            gameOverTitle.style.color = win ? '#4CAF50' : '#f44336';
            finalScoreElement.textContent = score;
        }

        function resetGame() {
            score = 0;
            level = 1;
            isGameOver = false;
            alienSpeed = 1;
            alienDirection = 1;
            projectiles = [];
            
            scoreElement.textContent = score;
            levelElement.textContent = level;
            gameOverScreen.style.display = 'none';
            
            player.x = canvas.width / 2 - 25;
            
            initAliens();
            gameLoop();
        }

        // Main game loop
        function gameLoop() {
            if (isGameOver) return;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Update
            player.update();
            updateProjectiles();
            updateAliens();
            checkCollisions();
            checkLevel();

            // Draw
            player.draw();
            drawProjectiles();
            drawAliens();

            animationId = requestAnimationFrame(gameLoop);
        }

        // Start game
        initAliens();
        gameLoop();
    </script>
</body>
</html>
